# core-authorization on the Miqaat Core DEV server.
#
# Runs the application only, attached to the existing `dev_miqaat_core_net` so it can reach the existing admin
# database and Redis by their host names. No database container, no migration, no seed: AUTHZ_DB_* in
# ../.env.dev-server must name the existing database and schema, and the app refuses to start if that schema or any
# mapped table/column is missing.
#
#   docker compose -f docker/docker-compose.dev-server.yml up -d --build
name: miqaat-authz-dev

services:
  authz:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: miqaat-core-identity-authorization-service:dev
    container_name: dev_miqaat_authz
    env_file:
      - ../.env
    ports:
      - "3002:3002"
    volumes:
      - authz-keys:/app/.keys
    networks:
      - dev_miqaat_core_net
    restart: unless-stopped

volumes:
  authz-keys:

networks:
  dev_miqaat_core_net:
    external: true
    name: dev_miqaat_core_net
