# Development: builds and runs core-authorization ONLY.
#
# No PostgreSQL service, no database volume, no migration, no seed, no init script. The app connects to the
# EXISTING authorization database and schema given in ../.env (AUTHZ_DB_HOST/PORT/NAME/SCHEMA/USER/PASSWORD - all
# required, no defaults) and reads the existing users, tenants, roles and permissions there. It refuses to start if
# that schema or any mapped table/column does not already exist.
#
#   cp .env.example .env   # fill in the existing database values
#   docker compose -f docker/docker-compose.yml up -d --build
#
# Inside the container "localhost" is the container itself: use the real database / Redis / identity host names
# (or host.docker.internal for services running on this machine).
name: miqaat-authz

services:
  authz:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: miqaat-core-identity-authorization-service:dev
    container_name: miqaat-authz
    env_file:
      - ../.env
    ports:
      - "3002:3002"
    volumes:
      # AUTHZ_SIGNING_KEY_FILE lives here, so a rebuild does not invalidate issued authorization tokens.
      - authz-keys:/app/.keys
    restart: unless-stopped

volumes:
  authz-keys:
