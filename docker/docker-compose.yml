# Local infrastructure for the Core Identity Authorization Service ONLY.
# Separate PostgreSQL server from the Authentication DB by design.
name: miqaat-authz

services:
  authz-postgres:
    image: postgres:16-alpine
    container_name: miqaat-authz-postgres
    environment:
      POSTGRES_USER: ${AUTHZ_DB_USER:-miqaat_authz}
      POSTGRES_PASSWORD: ${AUTHZ_DB_PASSWORD:-change-me-local}
      POSTGRES_DB: ${AUTHZ_DB_NAME:-miqaat_authz}
    ports:
      - "5442:5432"
    volumes:
      - authz-pgdata:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AUTHZ_DB_USER:-miqaat_authz} -d ${AUTHZ_DB_NAME:-miqaat_authz}"]
      interval: 5s
      timeout: 3s
      retries: 20

  authz-redis:
    image: redis:7-alpine
    container_name: miqaat-authz-redis
    ports:
      - "6392:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  authz-pgdata:
